<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud DevOps Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <!-- HERO -->
    <section class="hero">

        <h1>Cloud Computing CI/CD Project</h1>

        <p>
            Automated deployment using GitHub Actions and AWS S3.
        </p>

        <button onclick="showMessage()">
            Check Status
        </button>

        <h3 id="message"></h3>

    </section>

    <!-- CARDS -->
    <section class="services">

        <div class="card">
            <h2>Build Pipeline</h2>
            <p>
                Builds and validates the project automatically.
            </p>
        </div>

        <div class="card">
            <h2>Test Pipeline</h2>
            <p>
                Runs testing before deployment.
            </p>
        </div>

        <div class="card">
            <h2>Deployment</h2>
            <p>
                Deploys website automatically to AWS S3.
            </p>
        </div>

    </section>

    <!-- FOOTER -->
    <footer>
        <p>Cloud Computing Final Project</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
